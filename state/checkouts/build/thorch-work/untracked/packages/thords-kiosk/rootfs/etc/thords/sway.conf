# ThorDS console startup: keep the splash visible until render windows are ready.

output * bg #000000 solid_color
output DSI-2 bg /usr/share/thords/boot-splash.png fit

# The kernel exposes both portrait-mounted OLEDs; rotate them into the Thor's
# physical landscape orientation and arrange them as two dedicated workspaces.
output DSI-2 mode 1920x1080@120Hz transform 90 position 0 0
# Keep the transformed outputs adjacent without overlap. Overlapping their
# global coordinates lets the wider top viewport paint onto DSI-1's left edge.
output DSI-1 transform 90 position 1920 0
workspace 1 output DSI-1
workspace 2 output DSI-2

# Hide both native Wayland and XWayland windows at map time. The window
# manager reveals only the two settled game surfaces, never the Qt launcher.
for_window [app_id="org.azahar_emu.Azahar"] border none, opacity 0
for_window [class="^Azahar$"] border none, opacity 0
for_window [title="^ThorDS Touch Calibration$"] move workspace 1, border none, fullscreen enable

input * {
    xkb_layout gb
}

input "0:0:top_touchscreen" {
    map_to_output DSI-2
    calibration_matrix 0 -1 1 1 0 0
}
input "0:0:bottom_touchscreen" {
    map_to_output DSI-1
    calibration_matrix 0 -1 1 1 0 0
}

seat seat0 hide_cursor 1000

# No bar, no wallpaper process, no desktop chrome.
exec_always /usr/bin/thords-session

# Recovery/debug shortcuts. Remove when kiosk behaviour is mature.
bindsym Mod4+Return exec foot
bindsym Mod4+Shift+e exec systemctl poweroff

# Handheld hardware controls. PipeWire follows the active speaker/headphone
# sink, while brightness changes keep both differently-scaled panels aligned.
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --locked XF86MonBrightnessUp exec /usr/bin/thords-brightness up
bindsym --locked XF86MonBrightnessDown exec /usr/bin/thords-brightness down
