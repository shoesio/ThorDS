version: 1
kind: DeviceProfile
name: ThorDS Azahar
description: Thor controls mapped to Azahar's keyboard profile
target_devices:
  - gamepad
  - keyboard
  - mouse
mapping:
  - { name: D-Up, source_event: { gamepad: { button: DPadUp } }, target_events: [ { keyboard: KeyT } ] }
  - { name: D-Down, source_event: { gamepad: { button: DPadDown } }, target_events: [ { keyboard: KeyG } ] }
  - { name: D-Left, source_event: { gamepad: { button: DPadLeft } }, target_events: [ { keyboard: KeyF } ] }
  - { name: D-Right, source_event: { gamepad: { button: DPadRight } }, target_events: [ { keyboard: KeyH } ] }
  - { name: Circle-Left, source_event: { gamepad: { axis: { name: LeftStick, direction: left, deadzone: 0.2 } } }, target_events: [ { keyboard: KeyLeft } ] }
  - { name: Circle-Right, source_event: { gamepad: { axis: { name: LeftStick, direction: right, deadzone: 0.2 } } }, target_events: [ { keyboard: KeyRight } ] }
  - { name: Circle-Up, source_event: { gamepad: { axis: { name: LeftStick, direction: up, deadzone: 0.2 } } }, target_events: [ { keyboard: KeyUp } ] }
  - { name: Circle-Down, source_event: { gamepad: { axis: { name: LeftStick, direction: down, deadzone: 0.2 } } }, target_events: [ { keyboard: KeyDown } ] }
  - { name: C-Left, source_event: { gamepad: { axis: { name: RightStick, direction: left, deadzone: 0.2 } } }, target_events: [ { keyboard: KeyJ } ] }
  - { name: C-Right, source_event: { gamepad: { axis: { name: RightStick, direction: right, deadzone: 0.2 } } }, target_events: [ { keyboard: KeyL } ] }
  - { name: C-Up, source_event: { gamepad: { axis: { name: RightStick, direction: up, deadzone: 0.2 } } }, target_events: [ { keyboard: KeyI } ] }
  - { name: C-Down, source_event: { gamepad: { axis: { name: RightStick, direction: down, deadzone: 0.2 } } }, target_events: [ { keyboard: KeyK } ] }
  - { name: A, source_event: { gamepad: { button: East } }, target_events: [ { keyboard: KeyA } ] }
  - { name: B, source_event: { gamepad: { button: South } }, target_events: [ { keyboard: KeyS } ] }
  - { name: X, source_event: { gamepad: { button: North } }, target_events: [ { keyboard: KeyZ } ] }
  - { name: Y, source_event: { gamepad: { button: West } }, target_events: [ { keyboard: KeyX } ] }
  - { name: L, source_event: { gamepad: { button: LeftBumper } }, target_events: [ { keyboard: KeyQ } ] }
  - { name: R, source_event: { gamepad: { button: RightBumper } }, target_events: [ { keyboard: KeyW } ] }
  - { name: ZL, source_event: { gamepad: { trigger: { name: LeftTrigger, deadzone: 0.2 } } }, target_events: [ { keyboard: Key1 } ] }
  - { name: ZR, source_event: { gamepad: { trigger: { name: RightTrigger, deadzone: 0.2 } } }, target_events: [ { keyboard: Key2 } ] }
  - { name: Start, source_event: { gamepad: { button: Start } }, target_events: [ { keyboard: KeyM } ] }
  - { name: Select, source_event: { gamepad: { button: Select } }, target_events: [ { keyboard: KeyN } ] }
